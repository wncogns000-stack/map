<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>양념반후라이드반 직업 신청</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --ink:#1d2330; --muted:#6b7385;
    --line:#e3e6ef; --brand:#3f6ae0; --brand-soft:#eaf0ff;
    --good:#1f9d63; --warn:#d9822b; --bad:#d64545;
    --radius:14px; --shadow:0 1px 3px rgba(20,25,45,.08),0 8px 24px rgba(20,25,45,.06);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#141822; --panel:#1c2130; --ink:#eef1f8; --muted:#a2abc0;
      --line:#2c3446; --brand:#7c9cff; --brand-soft:#232c44;
      --good:#48c98a; --warn:#e5a65a; --bad:#f07070;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    line-height:1.55; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:860px; margin:0 auto; padding:16px 16px 64px}
  header{display:flex; align-items:center; gap:10px; padding:18px 0 10px; flex-wrap:wrap}
  header h1{font-size:1.35rem; margin:0; letter-spacing:-.02em}
  .badge{font-size:.78rem; background:var(--brand-soft); color:var(--brand); padding:3px 10px; border-radius:999px; font-weight:700}
  .spacer{flex:1}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:14px}
  .card h2{font-size:1.05rem; margin:0 0 4px}
  .hint{color:var(--muted); font-size:.88rem; margin:0 0 14px}
  label{display:block; font-weight:700; font-size:.9rem; margin:12px 0 6px}
  input[type=text],input[type=number],input[type=password],select,textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    background:var(--bg); color:var(--ink); font:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand); outline-offset:1px}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row>*{flex:1; min-width:140px}
  button{font:inherit; font-weight:700; cursor:pointer; border-radius:10px; border:1px solid transparent; padding:11px 16px}
  .btn{background:var(--brand); color:#fff}
  .btn:hover{filter:brightness(1.05)}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--line)}
  .btn-danger{background:var(--bad); color:#fff}
  .btn-sm{padding:7px 11px; font-size:.85rem}
  .btn:disabled,.btn-ghost:disabled{opacity:.45; cursor:not-allowed}
  .jobs{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin-top:6px}
  .job{position:relative; text-align:left; background:var(--panel); border:1.5px solid var(--line); border-radius:12px; padding:13px 13px 12px; cursor:pointer; transition:border-color .12s, transform .06s}
  .job:hover{border-color:var(--brand)}
  .job:active{transform:scale(.99)}
  .job.picked{border-color:var(--brand); background:var(--brand-soft)}
  .job .name{font-weight:800; font-size:1rem; display:flex; align-items:center; gap:6px}
  .job .cap{color:var(--muted); font-size:.78rem; font-weight:600}
  .job .desc{color:var(--muted); font-size:.85rem; margin-top:6px; white-space:pre-wrap}
  .pick-badge{position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%; background:var(--brand); color:#fff; display:grid; place-items:center; font-size:.8rem; font-weight:800}
  .picked-list{display:flex; flex-direction:column; gap:8px; margin:10px 0 0}
  .picked-list .slot{display:flex; align-items:center; gap:10px; border:1px dashed var(--line); border-radius:10px; padding:10px 12px; font-size:.92rem}
  .picked-list .slot b{color:var(--brand); min-width:52px}
  .picked-list .slot.filled{border-style:solid}
  table{width:100%; border-collapse:collapse; font-size:.9rem}
  th,td{border-bottom:1px solid var(--line); padding:8px 6px; text-align:left; vertical-align:middle}
  th{font-size:.82rem; color:var(--muted); font-weight:700; white-space:nowrap}
  td.num,th.num{text-align:center; width:48px}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
  .tag{display:inline-block; font-size:.78rem; padding:2px 8px; border-radius:999px; background:var(--brand-soft); color:var(--brand); font-weight:700}
  .tag.gray{background:var(--line); color:var(--muted)}
  .tag.good{background:rgba(31,157,99,.14); color:var(--good)}
  .msg{padding:11px 13px; border-radius:10px; font-size:.9rem; font-weight:600; margin:10px 0}
  .msg.err{background:rgba(214,69,69,.12); color:var(--bad)}
  .msg.ok{background:rgba(31,157,99,.13); color:var(--good)}
  .msg.info{background:var(--brand-soft); color:var(--brand)}
  .done{text-align:center; padding:34px 14px}
  .done .big{font-size:3rem; line-height:1}
  .done h2{font-size:1.3rem; margin:12px 0 6px}
  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
  .tabs button{background:transparent; border:1px solid var(--line); color:var(--muted); padding:8px 13px; font-size:.9rem}
  .tabs button[aria-selected="true"]{background:var(--brand); border-color:var(--brand); color:#fff}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
  .stat{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
  .stat .k{font-size:.8rem; color:var(--muted); font-weight:700}
  .stat .v{font-size:1.4rem; font-weight:800}
  .bar{height:7px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:6px}
  .bar>span{display:block; height:100%; background:var(--brand)}
  footer{text-align:center; color:var(--muted); font-size:.8rem; padding:26px 0 8px}
  .jobedit{display:grid; grid-template-columns:1.1fr 74px 2.4fr 44px; gap:8px; align-items:start; margin-bottom:8px}
  .jobedit.j5{grid-template-columns:1fr 60px 155px 2fr 44px}
  .jobedit textarea{min-height:44px; resize:vertical}
  @media (max-width:620px){
    .jobedit{grid-template-columns:1fr 70px 40px; grid-template-areas:"n c d" "t t t"}
    .jobedit>*:nth-child(1){grid-area:n} .jobedit>*:nth-child(2){grid-area:c}
    .jobedit>*:nth-child(3){grid-area:t} .jobedit>*:nth-child(4){grid-area:d}
    .jobedit.j5{grid-template-areas:"n c d" "w w w" "t t t"}
    .jobedit.j5>*:nth-child(3){grid-area:w} .jobedit.j5>*:nth-child(4){grid-area:t}
    .jobedit.j5>*:nth-child(5){grid-area:d}
  }
  .noprint{}
  @media print{ .noprint{display:none} body{background:#fff} .card{box-shadow:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="appTitle">양념반후라이드반 직업 신청</h1>
    <span class="badge" id="monthBadge">—</span>
    <span class="spacer"></span>
    <button class="btn-ghost btn-sm noprint" id="teacherBtn">교사용</button>
  </header>
  <main id="view"></main>
  <footer>제출한 내용은 선생님만 볼 수 있어요.</footer>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 *  기본 설정값 (교사용 화면에서 언제든지 수정할 수 있습니다)
 * ------------------------------------------------------------------ */
// 교사용 비밀번호 (고정)
const TEACHER_PIN = "3051";

const DEFAULT_CONFIG = {
  title: "양념반후라이드반 직업 신청",
  monthLabel: "",              // 비워두면 현재 연월이 자동으로 들어갑니다
  pin: TEACHER_PIN,
  round: 1,                    // 초기화할 때마다 1씩 올라갑니다
  choiceCount: 3,
  // 하는 일과 인원은 2026. 6. 15. 표준근로계약서를 그대로 옮긴 것입니다.
  jobs: [
    { id:"j1",  name:"돌쇠",     cap:1, when:"수시",
      desc:"회장, 남부회장, 여부회장 업무 보조 및 공정성 확인" },
    { id:"j3",  name:"칠가이",   cap:1, when:"수시",
      desc:"칠판 지우기 및 마카 정리, 날짜·요일·시간표 수정" },
    { id:"j4",  name:"편돌이",   cap:1, when:"수시",
      desc:"매점 청소 및 재고 관리, 판매" },
    { id:"j5",  name:"안나",     cap:1, when:"수시",
      desc:"가정통신문, 안내장, 활동지 배부" },
    { id:"j6",  name:"배민",     cap:2, when:"매일 아침 · 수시",
      desc:"우유 배달, 다른 교실 물건 배달" },
    { id:"j7",  name:"피카츄",   cap:2, when:"등교·하교 · 수시",
      desc:"공기청정기 ON/OFF, 에어컨·난방기·태블릿 관리" },
    { id:"j8",  name:"테트리스", cap:1, when:"수시 · 주2회(월·목)",
      desc:"보드게임 정리, 서랍장 청소" },
    { id:"j9",  name:"사스코",   cap:1, when:"수시 · 주2회(월·목)",
      desc:"교실 창문, 블라인드, 사물함 관리 및 청소" },
    { id:"j10", name:"스즈메",   cap:2, when:"수시 · 주2회(월·목)",
      desc:"문단속, TV, 형광등 관리, 앞뒷문틀 청소" },
    { id:"j11", name:"중계당",   cap:4, when:"주2회(월·목)",
      desc:"(월) 4층·5층 사이 계단 청소, (목) 대강당 청소" },
    { id:"j12", name:"영미신",   cap:3, when:"주2회(월·목)",
      desc:"복도 바닥, 복도 창틀, 신발장 쓸고 닦기" },
    { id:"j13", name:"교머니",   cap:3, when:"주2회(월·목)",
      desc:"교실 앞·뒤·중앙, 쓰레기통 주변 청소, 책상 줄 정리" }
  ]
};

/* ------------------------------------------------------------------ *
 *  저장소 : 기본은 이 기기(localStorage), ?api= 링크가 있으면 공유 모드
 * ------------------------------------------------------------------ */
const LS = {
  cfg:"jobapp.v1.config", subs:"jobapp.v1.subs", asg:"jobapp.v1.assign",
  lock:"jobapp.v1.lock", api:"jobapp.v1.api"
};
const qs = new URLSearchParams(location.search);
if (qs.get("api")) localStorage.setItem(LS.api, qs.get("api").trim());
const API = (localStorage.getItem(LS.api) || "").trim();
const REMOTE = !!API;

function jread(k, fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function jwrite(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

async function callApi(payload){
  const res = await fetch(API, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" }, // preflight 회피
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "요청을 처리하지 못했어요.");
  return data;
}

const Store = {
  remote: REMOTE,

  async publicConfig(){
    if (!REMOTE) return normalizeConfig(jread(LS.cfg, null) || DEFAULT_CONFIG);
    const d = await callApi({ action:"public" });
    return normalizeConfig(d.config || DEFAULT_CONFIG);
  },
  async hasSubmitted(round, number){
    if (!REMOTE){
      return jread(LS.subs, []).some(s => s.round === round && Number(s.number) === Number(number));
    }
    const d = await callApi({ action:"check", round, number });
    return !!d.submitted;
  },
  async submit(rec){
    if (!REMOTE){
      const subs = jread(LS.subs, []);
      if (subs.some(s => s.round === rec.round && Number(s.number) === Number(rec.number)))
        throw new Error("이미 그 번호로 신청한 기록이 있어요. 선생님께 말씀드리세요.");
      subs.push(rec); jwrite(LS.subs, subs); return true;
    }
    await callApi({ action:"submit", record: rec });
    return true;
  },
  async all(pin){
    if (!REMOTE){
      return { submissions: jread(LS.subs, []), assignments: jread(LS.asg, {}), config: jread(LS.cfg, null) };
    }
    const d = await callApi({ action:"all", pin });
    return { submissions: d.submissions || [], assignments: d.assignments || {}, config: d.config || null };
  },
  async saveConfig(pin, config){
    if (!REMOTE){ jwrite(LS.cfg, config); return true; }
    await callApi({ action:"config", pin, config });
    return true;
  },
  async saveAssignments(pin, assignments){
    if (!REMOTE){ jwrite(LS.asg, assignments); return true; }
    await callApi({ action:"assign", pin, assignments });
    return true;
  },
  async reset(pin, config){
    if (!REMOTE){
      jwrite(LS.subs, []); jwrite(LS.asg, {}); jwrite(LS.cfg, config); return true;
    }
    await callApi({ action:"reset", pin, config });
    return true;
  }
};

/* ------------------------------------------------------------------ *
 *  도우미
 * ------------------------------------------------------------------ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function thisMonthLabel(){ const d=new Date(); return d.getFullYear()+"년 "+(d.getMonth()+1)+"월"; }
function normalizeConfig(c){
  const cfg = Object.assign({}, DEFAULT_CONFIG, c || {});
  cfg.jobs = (cfg.jobs || []).map((j,i) => ({
    id: j.id || ("j"+(i+1)), name: String(j.name||"").trim(),
    cap: Math.max(0, parseInt(j.cap,10) || 0),
    when: String(j.when||""), desc: String(j.desc||"")
  })).filter(j => j.name);
  cfg.round = parseInt(cfg.round,10) || 1;
  cfg.choiceCount = Math.min(Math.max(1, parseInt(cfg.choiceCount,10) || 3), 5);
  cfg.pin = TEACHER_PIN;                                   // 저장된 값과 무관하게 고정
  return cfg;
}
function jobName(cfg, id){ const j = cfg.jobs.find(x => x.id === id); return j ? j.name : "—"; }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function byNumber(a,b){ return (Number(a.number)||0) - (Number(b.number)||0); }
function nowStamp(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}

/* ------------------------------------------------------------------ *
 *  배정 알고리즘 : 1지망부터 차례대로, 정원이 넘치면 무작위 추첨
 * ------------------------------------------------------------------ */
function autoAssign(cfg, submissions){
  const left = {}; cfg.jobs.forEach(j => left[j.id] = j.cap);
  const result = {};                       // number -> jobId ("" = 미배정)
  const students = shuffle(submissions.slice());
  const pending = new Set(students.map(s => String(s.number)));

  for (let rank = 0; rank < cfg.choiceCount; rank++){
    const wanted = {};                     // jobId -> [학생]
    students.forEach(s => {
      if (!pending.has(String(s.number))) return;
      const id = (s.choices || [])[rank];
      if (!id || left[id] === undefined || left[id] <= 0) return;
      (wanted[id] = wanted[id] || []).push(s);
    });
    Object.keys(wanted).forEach(id => {
      const winners = shuffle(wanted[id]).slice(0, left[id]);
      winners.forEach(s => { result[String(s.number)] = id; pending.delete(String(s.number)); left[id]--; });
    });
  }
  pending.forEach(n => { result[n] = ""; });   // 지망한 직업이 모두 찬 경우
  return result;
}

/* ------------------------------------------------------------------ *
 *  화면 그리기
 * ------------------------------------------------------------------ */
const view = document.getElementById("view");
let CFG = normalizeConfig(DEFAULT_CONFIG);
let picks = [];            // 선택한 직업 id 배열 (지망 순서)

function paintHeader(){
  document.getElementById("appTitle").textContent = CFG.title || "우리 반 직업 신청";
  document.getElementById("monthBadge").textContent = CFG.monthLabel || thisMonthLabel();
  document.title = CFG.title || "우리 반 직업 신청";
}

/* ---------- 학생 : 신청 화면 ---------- */
function renderStudent(msg){
  paintHeader();
  const need = Math.min(CFG.choiceCount, CFG.jobs.length);
  const slots = [];
  for (let i = 0; i < need; i++){
    const id = picks[i];
    slots.push(`<div class="slot ${id?"filled":""}"><b>${i+1}지망</b>
      <span>${id ? esc(jobName(CFG, id)) : "<span style='color:var(--muted)'>아래에서 골라 주세요</span>"}</span></div>`);
  }
  view.innerHTML = `
    ${msg ? `<div class="msg err">${esc(msg)}</div>` : ""}
    <section class="card">
      <h2>1. 내 정보</h2>
      <p class="hint">이름과 번호를 정확하게 적어 주세요.</p>
      <div class="row">
        <div><label for="sNum">번호</label><input id="sNum" type="number" min="1" max="50" inputmode="numeric" placeholder="예) 7"></div>
        <div style="flex:2"><label for="sName">이름</label><input id="sName" type="text" maxlength="12" placeholder="예) 김하늘"></div>
      </div>
    </section>

    <section class="card">
      <h2>2. 하고 싶은 직업 ${need}가지 고르기</h2>
      <p class="hint">누른 순서대로 1지망 → ${need}지망이 돼요. 다시 누르면 선택이 취소됩니다.
        신청자가 많으면 다른 지망으로 배정될 수 있어요.</p>
      <div class="picked-list">${slots.join("")}</div>
      <div class="jobs" id="jobGrid">
        ${CFG.jobs.map(j => {
          const at = picks.indexOf(j.id);
          return `<div class="job ${at>=0?"picked":""}" data-id="${esc(j.id)}" role="button" tabindex="0">
            ${at>=0 ? `<div class="pick-badge">${at+1}</div>` : ""}
            <div class="name">${esc(j.name)}</div>
            <div class="cap">뽑는 인원 ${j.cap}명${j.when ? " · " + esc(j.when) : ""}</div>
            <div class="desc">${esc(j.desc)}</div>
          </div>`;
        }).join("")}
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn-ghost" id="clearPick" style="flex:0 0 auto">선택 지우기</button>
        <button class="btn" id="submitBtn">제출하기</button>
      </div>
      <p class="hint" style="margin:10px 0 0">제출한 뒤에는 내용을 다시 볼 수 없고, 고칠 수도 없어요. 잘 확인하고 제출하세요.</p>
    </section>`;

  // 선택이 바뀔 때 화면 전체를 다시 그리지 않고 배지와 지망 목록만 갱신합니다.
  const paintPicks = () => {
    view.querySelectorAll(".picked-list .slot").forEach((slot, i) => {
      const id = picks[i];
      slot.classList.toggle("filled", !!id);
      slot.lastElementChild.innerHTML = id
        ? esc(jobName(CFG, id))
        : "<span style='color:var(--muted)'>아래에서 골라 주세요</span>";
    });
    view.querySelectorAll(".job[data-id]").forEach(el => {
      const at = picks.indexOf(el.dataset.id);
      el.classList.toggle("picked", at >= 0);
      const badge = el.querySelector(".pick-badge");
      if (at >= 0){
        if (badge) badge.textContent = at + 1;
        else el.insertAdjacentHTML("afterbegin", `<div class="pick-badge">${at+1}</div>`);
      } else if (badge) badge.remove();
    });
  };
  view.querySelectorAll(".job[data-id]").forEach(el => {
    const toggle = () => {
      const id = el.dataset.id, at = picks.indexOf(id);
      if (at >= 0) picks.splice(at, 1);
      else if (picks.length < need) picks.push(id);
      else { flash("이미 " + need + "가지를 골랐어요. 바꾸려면 고른 직업을 다시 누르세요."); return; }
      paintPicks();
    };
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } });
  });
  view.querySelector("#clearPick").onclick = () => { picks = []; paintPicks(); };
  view.querySelector("#submitBtn").onclick = doSubmit;
}

function flash(text){
  const old = document.querySelector(".flash-msg");
  if (old) old.remove();
  const d = document.createElement("div");
  d.className = "msg info flash-msg";
  d.textContent = text;
  view.prepend(d);
  setTimeout(() => d.remove(), 3000);
}

async function doSubmit(){
  const need = Math.min(CFG.choiceCount, CFG.jobs.length);
  const number = parseInt(view.querySelector("#sNum").value, 10);
  const name = (view.querySelector("#sName").value || "").trim();
  if (!number || number < 1 || number > 50) return flash("번호를 바르게 입력해 주세요.");
  if (name.length < 2) return flash("이름을 정확히 입력해 주세요.");
  if (picks.length < need) return flash(need + "가지 직업을 모두 골라 주세요.");

  const list = picks.map((id, i) => `${i+1}지망 ${jobName(CFG, id)}`).join("\n");
  if (!confirm(`${number}번 ${name}\n\n${list}\n\n이대로 제출할까요?\n제출하면 다시 볼 수 없어요.`)) return;

  const btn = view.querySelector("#submitBtn");
  btn.disabled = true; btn.textContent = "제출 중…";
  const rec = { round: CFG.round, number, name, choices: picks.slice(), at: nowStamp() };
  try{
    if (await Store.hasSubmitted(CFG.round, number))
      throw new Error("이미 그 번호로 신청했어요. 선생님께 말씀드리세요.");
    await Store.submit(rec);
    jwrite(LS.lock, { round: CFG.round, number, name, at: rec.at });
    picks = [];
    renderDone({ number, name });
  }catch(err){
    btn.disabled = false; btn.textContent = "제출하기";
    flash(err.message || "제출하지 못했어요. 다시 시도해 주세요.");
  }
}

function renderTeacherLogin(err){
  view.innerHTML = `
    <section class="card">
      <h2>교사용 화면</h2>
      <p class="hint">선생님용 화면입니다. 비밀번호를 입력하세요.</p>

        <button class="btn" id="go">확인</button>
      </div>

  const go = async () => {
    const pin = view.querySelector("#pin").value.trim();

    try{
      const data = await Store.all(pin);
      if (data.config) CFG = normalizeConfig(data.config);   // 교사에게만 비밀번호까지 전달
      renderTeacher(pin, data, "submissions");
    }catch(e){ renderTeacherLogin(e.message || "비밀번호가 맞지 않아요."); }

  view.querySelector("#pin").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  view.querySelector("#back").onclick = () => start();

/* ---------- 교사 : 대시보드 ---------- */
async function refreshTeacher(pin, tab){
  const data = await Store.all(pin);
  renderTeacher(pin, data, tab);
}

function renderTeacher(pin, data, tab){
  paintHeader();
  const subs = (data.submissions || []).filter(s => s.round === CFG.round).sort(byNumber);
  const asg  = data.assignments || {};
  const tabs = [["submissions","신청 현황"],["assign","직업 배정"],["jobs","직업 관리"],["settings","설정·초기화"]];

  view.innerHTML = `
    <div class="tabs noprint">
      ${tabs.map(([k,l]) => `<button data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join("")}
      <span class="spacer"></span>
      <button class="btn-ghost btn-sm" id="exitT">학생 화면으로</button>
    </div>
    <div id="tabBody"></div>`;

  view.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => renderTeacher(pin, data, b.dataset.tab));
  view.querySelector("#exitT").onclick = () => start();

  const body = view.querySelector("#tabBody");
  if (tab === "submissions") tabSubmissions(body, pin, subs);
  if (tab === "assign")      tabAssign(body, pin, subs, asg);
  if (tab === "jobs")        tabJobs(body, pin);
  if (tab === "settings")    tabSettings(body, pin, subs);
}

          ${Array.from({length:Math.min(CFG.choiceCount,CFG.jobs.length)},(_,i)=>`<td>${esc(jobName(CFG,(s.choices||[])[i]))}</td>`).join("")}

function tabAssign(body, pin, subs, asg){
  const need = Math.min(CFG.choiceCount, CFG.jobs.length);

  const byJob = {}; CFG.jobs.forEach(j => byJob[j.id] = []);

      <h2>직업 배정</h2>

    </div>`).join("");
  body.innerHTML = `
    <section class="card">
      <h2>신청하는 직업</h2>
      <p class="hint">이름 · 뽑는 인원 · 하는 일 설명을 자유롭게 고칠 수 있어요. 학생 화면에 그대로 보입니다.</p>

      </div>

      <div class="row"><button class="btn" id="saveJobs">저장하기</button></div>
      <p class="hint" style="margin:10px 0 0">저장하면 학생 화면에 바로 반영돼요. 이미 제출된 신청 내용은 그대로 남습니다.</p>
    </section>`;

    const jobs = Array.from(body.querySelectorAll("#jobRows .jobedit")).map((r,i) => ({
      id: CFG.jobs[Number(r.dataset.i)] ? CFG.jobs[Number(r.dataset.i)].id : ("j"+Date.now()+i),

      cap: Math.max(0, parseInt(r.querySelector(".e-cap").value,10) || 0),
      when: r.querySelector(".e-when").value.trim(),
      desc: r.querySelector(".e-desc").value.trim()
    })).filter(j => j.name);
    return { jobs };
  };
  body.querySelector("#addJob").onclick = () => {
    const { jobs } = collect();
    jobs.push({ id:"j"+Date.now(), name:"새 직업", cap:1, when:"", desc:"" });
    CFG = normalizeConfig(Object.assign({}, CFG, { jobs }));
    tabJobs(body, pin);
  };
  body.querySelectorAll(".e-del").forEach(b => b.onclick = () => {

  };
  body.querySelector("#resetAll").onclick = async () => {
    if (!confirm("정말 모든 신청 기록을 지울까요? 되돌릴 수 없어요.")) return;
    const typed = prompt('확인을 위해 "초기화" 라고 입력해 주세요.');
    if (typed !== "초기화") return alert("초기화를 취소했어요.");
    const next = normalizeConfig(Object.assign({}, CFG, { round: CFG.round + 1 }));
    await Store.reset(pin, next);
    CFG = next;
    localStorage.removeItem(LS.lock);
    alert("초기화했어요. 이제 새로 신청받을 수 있어요.");
    refreshTeacher(pin, "submissions");
  };
}

/* ------------------------------------------------------------------ *
 *  내려받기 (워드 문서 / CSV)
 * ------------------------------------------------------------------ */
function saveBlob(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}
/**
 * 파일 이름은 영문·숫자로 만듭니다. 한글 파일 이름을 그대로 쓰면 일부 브라우저가
 * 이름을 버리고 확장자 없는 "download" 파일로 저장해 버려 문서가 열리지 않습니다.
 * 문서 안의 제목은 한글 그대로 들어갑니다.
 */
function fileStem(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return "class-jobs_" + d.getFullYear() + "-" + p(d.getMonth()+1);
}
function downloadDoc(subs, asg){
  const need = Math.min(CFG.choiceCount, CFG.jobs.length);
  const rows = subs.slice().sort(byNumber).map(s => {
    const cells = Array.from({length:need}, (_,i) => `<td>${esc(jobName(CFG,(s.choices||[])[i]))}</td>`).join("");
    const a = asg[String(s.number)];
    return `<tr><td align="center">${esc(s.number)}</td><td>${esc(s.name)}</td>${cells}<td><b>${a?esc(jobName(CFG,a)):"미배정"}</b></td></tr>`;
  }).join("");
  const byJob = CFG.jobs.map(j => {
    const list = subs.filter(s => asg[String(s.number)] === j.id).sort(byNumber)
                     .map(s => s.number + "번 " + s.name);
    return `<tr><td><b>${esc(j.name)}</b></td><td align="center">${list.length}/${j.cap}</td>` +
           `<td>${esc(j.when) || "-"}</td><td>${esc(list.join(", ")) || "-"}</td></tr>`;
  }).join("");
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(fileStem())}</title>
    <style>
      body{font-family:"Malgun Gothic","맑은 고딕",sans-serif; font-size:11pt}
      h1{font-size:16pt; margin:0 0 4px} h2{font-size:12.5pt; margin:22px 0 6px}
      p.sub{color:#555; margin:0 0 14px; font-size:10pt}
      table{border-collapse:collapse; width:100%}
      th,td{border:1px solid #999; padding:5px 7px; font-size:10.5pt}
      th{background:#eef1f8}
    </style></head><body>
    <h1>${esc(CFG.title)}</h1>
    <p class="sub">${esc(CFG.monthLabel || thisMonthLabel())} · 출력일 ${esc(nowStamp())} · 제출 ${subs.length}명</p>
    <h2>1. 번호순 신청·배정 결과</h2>
    <table><tr><th width="52">번호</th><th width="90">이름</th>
      ${Array.from({length:need},(_,i)=>`<th>${i+1}지망</th>`).join("")}<th>배정 직업</th></tr>${rows}</table>
    <h2>2. 직업별 명단</h2>
    <table><tr><th width="110">직업</th><th width="56">인원</th><th width="130">횟수</th><th>학생</th></tr>${byJob}</table>
    </body></html>`;
  saveBlob(fileStem() + ".doc", new Blob(["﻿" + html], { type:"application/msword;charset=utf-8" }));
}
function downloadCsv(subs, asg){
  const need = Math.min(CFG.choiceCount, CFG.jobs.length);
  const q = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const head = ["번호","이름", ...Array.from({length:need},(_,i)=>(i+1)+"지망"), "배정 직업","제출 시각"];
  const lines = [head.map(q).join(",")];
  subs.slice().sort(byNumber).forEach(s => {
    const a = asg[String(s.number)];
    lines.push([s.number, s.name,
      ...Array.from({length:need},(_,i)=>jobName(CFG,(s.choices||[])[i])),
      a ? jobName(CFG,a) : "미배정", s.at || ""].map(q).join(","));
  });
  saveBlob(fileStem() + ".csv", new Blob(["﻿" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" }));
}

async function start(){
  view.innerHTML = `<section class="card"><p class="hint" style="margin:0">불러오는 중…</p></section>`;
  try{
    CFG = await Store.publicConfig();
  }catch(e){
    view.innerHTML = `<section class="card"><div class="msg err">
      설정을 불러오지 못했어요. 인터넷 연결을 확인하거나 선생님께 알려 주세요.<br>(${esc(e.message)})</div></section>`;
    return;
  }
  paintHeader();
  const lock = jread(LS.lock, null);
  if (lock && lock.round === CFG.round) renderDone(lock);
  else { picks = []; renderStudent(); }
}
start();
