<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<title>양념반후라이드반 직업 신청</title>
<style>
  /* ---------- 색 · 글꼴 ---------- */
  :root{
    --bg:#fff6e9; --bg-2:#ffe9cf; --panel:#fffdfa; --ink:#33221a; --muted:#8d7566;
    --line:#f2ddc2; --brand:#f2610c; --brand-2:#ffb020; --brand-soft:#fff0dc;
    --good:#14a06b; --warn:#e08900; --bad:#e0443e;
    --radius:20px;
    --shadow:0 2px 0 rgba(180,120,60,.10), 0 10px 26px rgba(180,110,40,.10);
    --shadow-lift:0 4px 0 rgba(180,120,60,.14), 0 16px 34px rgba(180,110,40,.16);
    --display:"Jua","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#1b1410; --bg-2:#241a13; --panel:#251b15; --ink:#f8ece0; --muted:#b59c8b;
      --line:#3d2d22; --brand:#ff9a4d; --brand-2:#ffc45e; --brand-soft:#33251b;
      --good:#4ccb95; --warn:#eaa94e; --bad:#f4726c;
      --shadow:0 2px 0 rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.35);
      --shadow-lift:0 4px 0 rgba(0,0,0,.4), 0 16px 34px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink);
    background:
      radial-gradient(900px 420px at 8% -8%, var(--bg-2), transparent 60%),
      radial-gradient(760px 380px at 108% 4%, var(--brand-soft), transparent 62%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    line-height:1.6; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:880px; margin:0 auto; padding:14px 16px 72px}

  /* ---------- 머리말 ---------- */
  header{display:flex; align-items:center; gap:12px; padding:20px 4px 14px; flex-wrap:wrap}
  .logo{
    width:52px; height:52px; flex:0 0 auto; border-radius:17px; display:grid; place-items:center;
    font-size:1.65rem; background:linear-gradient(145deg,var(--brand-2),var(--brand));
    box-shadow:var(--shadow); transform:rotate(-6deg);
  }
  .head-text{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; min-width:0}
  header h1{font-family:var(--display); font-size:1.6rem; font-weight:400; margin:0; letter-spacing:.01em}
  .badge{
    font-size:.78rem; font-weight:800; padding:4px 11px; border-radius:999px; white-space:nowrap;
    background:var(--brand-soft); color:var(--brand); border:1.5px solid var(--line);
  }
  .spacer{flex:1}

  /* ---------- 카드 ---------- */
  .card{
    position:relative; background:var(--panel); border:1.5px solid var(--line);
    border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .card h2{font-family:var(--display); font-weight:400; font-size:1.22rem; margin:0 0 4px; letter-spacing:.01em}
  .hint{color:var(--muted); font-size:.89rem; margin:0 0 14px}

  /* ---------- 입력 ---------- */
  label{display:block; font-weight:800; font-size:.88rem; margin:14px 0 6px}
  input[type=text],input[type=number],input[type=password],select,textarea{
    width:100%; padding:12px 13px; border:1.5px solid var(--line); border-radius:13px;
    background:var(--bg); color:var(--ink); font:inherit; transition:border-color .15s, box-shadow .15s;
  }
  input:hover,select:hover,textarea:hover{border-color:var(--brand-2)}
  input:focus,select:focus,textarea:focus{
    outline:none; border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft);
  }
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row>*{flex:1; min-width:140px}

  /* ---------- 단추 ---------- */
  button{
    font:inherit; font-weight:800; cursor:pointer; border-radius:999px;
    border:1.5px solid transparent; padding:12px 20px; transition:transform .1s, box-shadow .15s, filter .15s;
  }
  .btn{
    background:linear-gradient(145deg,var(--brand-2),var(--brand)); color:#fff;
    box-shadow:0 3px 0 rgba(150,70,10,.25); text-shadow:0 1px 0 rgba(120,60,10,.25);
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 5px 0 rgba(150,70,10,.25)}
  .btn:active{transform:translateY(1px); box-shadow:0 1px 0 rgba(150,70,10,.25)}
  .btn-ghost{background:var(--panel); color:var(--ink); border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--brand); color:var(--brand); transform:translateY(-1px)}
  .btn-danger{background:var(--bad); color:#fff; box-shadow:0 3px 0 rgba(150,30,25,.25)}
  .btn-danger:hover{transform:translateY(-2px)}
  .btn-sm{padding:8px 14px; font-size:.85rem}
  .btn:disabled,.btn-ghost:disabled{opacity:.42; cursor:not-allowed; transform:none; box-shadow:none}

  /* ---------- 직업 카드 ---------- */
  .jobs{display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:12px; margin-top:8px}
  .job{
    position:relative; text-align:left; background:var(--panel); border:2px solid var(--line);
    border-radius:18px; padding:15px 15px 14px; cursor:pointer;
    transition:transform .12s, border-color .15s, box-shadow .15s, background .15s;
  }
  .job:hover{border-color:var(--brand-2); transform:translateY(-3px); box-shadow:var(--shadow-lift)}
  .job:focus-visible{outline:none; border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft)}
  .job:active{transform:translateY(0) scale(.99)}
  .job.picked{
    border-color:var(--brand); background:linear-gradient(160deg,var(--brand-soft),var(--panel) 65%);
    box-shadow:var(--shadow-lift);
  }
  .job-icon{
    width:38px; height:38px; border-radius:12px; display:grid; place-items:center; font-size:1.2rem;
    background:var(--brand-soft); border:1.5px solid var(--line); margin-bottom:9px;
  }
  .job.picked .job-icon{background:#fff; border-color:var(--brand-2)}
  .job .name{font-weight:800; font-size:1.05rem; display:flex; align-items:center; gap:6px; letter-spacing:-.01em}
  .job .cap{color:var(--brand); font-size:.76rem; font-weight:800; margin-top:2px}
  .job .desc{color:var(--muted); font-size:.85rem; margin-top:7px; white-space:pre-wrap}
  .pick-badge{
    position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%;
    background:linear-gradient(145deg,var(--brand-2),var(--brand)); color:#fff;
    display:grid; place-items:center; font-size:.9rem; font-weight:800;
    box-shadow:0 3px 8px rgba(190,90,20,.4); animation:pop .22s ease-out;
  }
  @keyframes pop{ from{transform:scale(.4) rotate(-18deg); opacity:0} to{transform:scale(1) rotate(0); opacity:1} }

  /* ---------- 지망 슬롯 ---------- */
  .picked-list{display:flex; flex-direction:column; gap:9px; margin:12px 0 4px}
  .picked-list .slot{
    display:flex; align-items:center; gap:11px; border:2px dashed var(--line);
    border-radius:14px; padding:11px 14px; font-size:.95rem; font-weight:700;
    background:var(--bg); transition:border-color .15s, background .15s;
  }
  .picked-list .slot b{
    color:var(--brand); min-width:58px; font-weight:800; display:flex; align-items:center; gap:5px;
  }
  .picked-list .slot:nth-child(1) b::before{content:"🥇"}
  .picked-list .slot:nth-child(2) b::before{content:"🥈"}
  .picked-list .slot:nth-child(3) b::before{content:"🥉"}
  .picked-list .slot:nth-child(n+4) b::before{content:"🎗️"}
  .picked-list .slot.filled{
    border-style:solid; border-color:var(--brand-2);
    background:linear-gradient(110deg,var(--brand-soft),var(--panel));
  }

  /* ---------- 표 ---------- */
  table{width:100%; border-collapse:separate; border-spacing:0; font-size:.9rem}
  th,td{border-bottom:1.5px solid var(--line); padding:10px 8px; text-align:left; vertical-align:middle}
  thead th{
    font-size:.79rem; color:var(--brand); font-weight:800; white-space:nowrap;
    background:var(--brand-soft); border-bottom:2px solid var(--line);
  }
  thead th:first-child{border-radius:11px 0 0 0}
  thead th:last-child{border-radius:0 11px 0 0}
  tbody tr:hover td{background:var(--brand-soft)}
  tbody tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:center; width:50px; font-weight:800}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:12px; border:1.5px solid var(--line)}

  /* ---------- 배지 · 안내 ---------- */
  .tag{display:inline-block; font-size:.77rem; padding:3px 10px; border-radius:999px; background:var(--brand-soft); color:var(--brand); font-weight:800; border:1.5px solid var(--line)}
  .tag.gray{background:var(--line); color:var(--muted)}
  .tag.good{background:rgba(20,160,107,.14); color:var(--good); border-color:rgba(20,160,107,.3)}
  .msg{padding:12px 15px; border-radius:14px; font-size:.9rem; font-weight:700; margin:10px 0; border:1.5px solid transparent}
  .msg.err{background:rgba(224,68,62,.1); color:var(--bad); border-color:rgba(224,68,62,.3)}
  .msg.ok{background:rgba(20,160,107,.12); color:var(--good); border-color:rgba(20,160,107,.3)}
  .msg.info{background:var(--brand-soft); color:var(--brand); border-color:var(--line)}

  /* ---------- 제출 완료 ---------- */
  .done{text-align:center; padding:40px 16px; overflow:hidden}
  .done .big{font-size:3.6rem; line-height:1; animation:cheer .6s cubic-bezier(.2,1.4,.5,1)}
  @keyframes cheer{ 0%{transform:scale(.3) rotate(-25deg); opacity:0} 60%{transform:scale(1.15) rotate(6deg)} 100%{transform:scale(1) rotate(0); opacity:1} }
  .done h2{font-family:var(--display); font-weight:400; font-size:1.5rem; margin:14px 0 6px}
  .done::before,.done::after{
    content:"🍗"; position:absolute; font-size:2.2rem; opacity:.16; pointer-events:none;
  }
  .done::before{left:18px; top:22px; transform:rotate(-20deg)}
  .done::after{right:18px; bottom:18px; transform:rotate(16deg)}

  /* ---------- 교사 탭 ---------- */
  .tabs{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px; align-items:center}
  .tabs button{background:var(--panel); border:1.5px solid var(--line); color:var(--muted); padding:9px 15px; font-size:.9rem}
  .tabs button:hover{color:var(--brand); border-color:var(--brand-2)}
  .tabs button[aria-selected="true"]{
    background:linear-gradient(145deg,var(--brand-2),var(--brand)); border-color:transparent; color:#fff;
    box-shadow:0 3px 0 rgba(150,70,10,.22);
  }

  /* ---------- 통계 ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:11px}
  .stat{
    background:linear-gradient(150deg,var(--brand-soft),var(--panel));
    border:1.5px solid var(--line); border-radius:15px; padding:12px 14px;
  }
  .stat .k{font-size:.79rem; color:var(--muted); font-weight:800}
  .stat .v{font-family:var(--display); font-weight:400; font-size:1.6rem; color:var(--brand)}
  .bar{height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:7px}
  .bar>span{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--brand-2),var(--brand)); transition:width .35s ease}

  .id-msg{font-size:.88rem; font-weight:800; margin-top:10px; min-height:1.2em}
  .id-msg.good{color:var(--good)}
  .id-msg.good::before{content:"✅ "}
  .id-msg.bad{color:var(--bad)}
  .id-msg.bad::before{content:"⚠️ "}
  .roster-box{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; min-height:190px; line-height:1.5}

  footer{text-align:center; color:var(--muted); font-size:.82rem; padding:28px 0 10px; font-weight:600}

  /* ---------- 직업 관리 편집 줄 ---------- */
  .jobedit{display:grid; grid-template-columns:1.1fr 74px 2.4fr 44px; gap:9px; align-items:start; margin-bottom:10px}
  .jobedit.j5{grid-template-columns:1fr 60px 155px 2fr 44px}
  .jobedit textarea{min-height:46px; resize:vertical}
  .jobedit .e-del{padding:10px 0; color:var(--bad)}
  .jobedit .e-del:hover{background:rgba(224,68,62,.1); border-color:var(--bad)}
  @media (max-width:620px){
    .jobedit{grid-template-columns:1fr 70px 40px; grid-template-areas:"n c d" "t t t"}
    .jobedit>*:nth-child(1){grid-area:n} .jobedit>*:nth-child(2){grid-area:c}
    .jobedit>*:nth-child(3){grid-area:t} .jobedit>*:nth-child(4){grid-area:d}
    .jobedit.j5{grid-template-areas:"n c d" "w w w" "t t t"}
    .jobedit.j5>*:nth-child(3){grid-area:w} .jobedit.j5>*:nth-child(4){grid-area:t}
    .jobedit.j5>*:nth-child(5){grid-area:d}
    /* 휴대폰에서는 머리말을 한 줄로 눕혀 화면을 아끼기 */
    header{gap:10px; padding:14px 2px 10px}
    .logo{width:44px; height:44px; font-size:1.35rem; border-radius:14px}
    .head-text{flex:1 1 0; min-width:0; flex-direction:column; align-items:flex-start; gap:3px}
    header h1{font-size:1.22rem}
    .spacer{display:none}
    #teacherBtn{margin-left:auto}
    .card{padding:16px}
    .jobs{grid-template-columns:1fr}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
  @media print{
    .noprint{display:none} body{background:#fff}
    .card{box-shadow:none; border-color:#ccc} .logo{display:none}
  }
</style>
</head>

<script>
(function(){
  var PIN = "3051";
  var KEY = "__fakeServer";   // 앱의 저장소와 분리 = 학생 기기를 바꿔도 서버 자료는 유지
  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ return null; }
  }
  var store = load() || { config:null, subs:[], assign:{}, files:[] };
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
  function handle(req){
    var a = req.action;
    if (a === "public") return { ok:true, config: store.config, webAppUrl:"https://script.google.com/macros/s/EXAMPLE/exec" };
    if (a === "check")  return { ok:true, submitted: store.subs.some(function(s){
                            return s.round === (req.round||1) && Number(s.number) === Number(req.number); }) };
    if (a === "submit") {
      var r = req.record || {};
      if (store.subs.some(function(s){ return s.round === r.round && Number(s.number) === Number(r.number); }))
        return { ok:false, error:"이미 그 번호로 신청했어요. 선생님께 말씀드리세요." };
      // 실제 시트와 똑같이: 지망 칸에는 '이름', 맨 뒤 칸에는 '코드'
      var ids = r.choices || [];
      var names = (r.choiceNames && r.choiceNames.length) ? r.choiceNames : ids;
      store.subs.push({ round:r.round, number:r.number, name:r.name,
                        sheetNames:names.slice(), code:ids.join("|"), at:r.at });
      save(); return { ok:true };
    }
    if (String(req.pin||"") !== PIN) return { ok:false, error:"비밀번호가 맞지 않습니다." };
    if (a === "all") {
      // readSubs_ 와 같은 규칙: 코드 칸이 있으면 코드, 없으면 지망 칸의 값
      var out = store.subs.map(function(s){
        return { round:s.round, number:s.number, name:s.name, at:s.at,
                 choices: s.code ? s.code.split("|") : (s.sheetNames || []).slice() };
      });
      return { ok:true, submissions: out, assignments: store.assign, config: store.config };
    }
    if (a === "config")   { store.config = req.config; save(); return { ok:true }; }
    if (a === "assign")   { store.assign = req.assignments || {}; save(); return { ok:true }; }
    if (a === "reset")    { store.subs = []; store.assign = {}; if (req.config) store.config = req.config; save(); return { ok:true }; }
    if (a === "exportsheet") {
      window.__exportedSheet = store.subs.map(function(s){
        return [s.number, s.name].concat(s.sheetNames || []).join(" | ");
      });
      return { ok:true, url:"https://docs.google.com/spreadsheets/d/FAKE/edit", name:"지망현황_2026-09-16", rows: store.subs.length };
    }
    if (a === "savefile") {
      store.files.push({ name:req.filename, mime:req.mime, content:req.content });
      save(); window.__savedFiles = store.files;
      return { ok:true, url:"https://drive.google.com/file/d/FAKE_" + store.files.length + "/view", name:req.filename };
    }
    return { ok:false, error:"알 수 없는 요청입니다: " + a };
  }
  function runner(){
    var ok = function(){}, fail = function(){};
    var self = {
      withSuccessHandler: function(f){ ok = f; return self; },
      withFailureHandler: function(f){ fail = f; return self; },
      api: function(json){
        setTimeout(function(){
          try { ok(JSON.stringify(handle(JSON.parse(json)))); }
          catch (e) { fail(e); }
        }, 5);
      }
    };
    return self;
  }
  window.google = { script: { get run(){ return runner(); } } };
})();
</script>

<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">🍗</div>
    <div class="head-text">
      <h1 id="appTitle">양념반후라이드반 직업 신청</h1>
      <span class="badge" id="monthBadge">—</span>
    </div>
    <span class="spacer"></span>
    <button class="btn-ghost btn-sm noprint" id="teacherBtn">교사용</button>
  </header>
  <main id="view"></main>
  <footer>🔒 제출한 내용은 선생님만 볼 수 있어요.</footer>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 *  기본 설정값 (교사용 화면에서 언제든지 수정할 수 있습니다)
 * ------------------------------------------------------------------ */
// 교사용 비밀번호 (고정)
const TEACHER_PIN = "3051";

// 직업 카드에 붙는 그림 문자. 목록에 없는 직업은 이름을 보고 자동으로 하나 고릅니다.
const JOB_ICONS = {
  "돌쇠":"💪", "칠가이":"🖍️", "편돌이":"🏪", "안나":"📮", "배민":"🥛", "피카츄":"⚡",
  "테트리스":"🧩", "사스코":"🪟", "스즈메":"🚪", "중계당":"🪜", "영미신":"👟", "교머니":"🧹",
  "모둠장":"🤝"
};
const ICON_POOL = ["⭐","🌈","🍀","🎈","🐣","🧺","📚","🎨","🔔","🌻","🎵","🧼"];
function jobIcon(name){
  if (JOB_ICONS[name]) return JOB_ICONS[name];
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return ICON_POOL[h % ICON_POOL.length];
}

const DEFAULT_CONFIG = {
  title: "양념반후라이드반 직업 신청",
  monthLabel: "",              // 비워두면 현재 연월이 자동으로 들어갑니다
  pin: TEACHER_PIN,
  round: 1,                    // 초기화할 때마다 1씩 올라갑니다
  choiceCount: 3,
  // 학생 명부 — [교사용] → [설정·초기화]에서 붙여넣습니다.
  // 여기에 실명을 적어 두면 저장소(공개)에 그대로 올라가므로 비워 둡니다.
  roster: [],
  // 하는 일과 인원은 2026. 6. 15. 표준근로계약서를 그대로 옮긴 것입니다.
  jobs: [
    { id:"j1",  name:"돌쇠",     cap:1, when:"수시",
      desc:"회장, 남부회장, 여부회장 업무 보조 및 공정성 확인" },
    { id:"j3",  name:"칠가이",   cap:1, when:"수시",
      desc:"칠판 지우기 및 마카 정리, 날짜·요일·시간표 수정" },
    { id:"j4",  name:"편돌이",   cap:1, when:"수시",
      desc:"매점 청소 및 재고 관리, 판매" },
    { id:"j5",  name:"안나",     cap:1, when:"수시",
      desc:"가정통신문, 안내장, 활동지 배부" },

/* ------------------------------------------------------------------ *
 *  저장소 : 기본은 이 기기(localStorage), ?api= 링크가 있으면 공유 모드
 * ------------------------------------------------------------------ */
const LS = {
  cfg:"jobapp.v1.config", subs:"jobapp.v1.subs", asg:"jobapp.v1.assign",
  lock:"jobapp.v1.lock", api:"jobapp.v1.api"
};
const qs = new URLSearchParams(location.search);
if (qs.get("api")) localStorage.setItem(LS.api, qs.get("api").trim());
const API = (localStorage.getItem(LS.api) || "").trim();

// 이 파일을 Apps Script 웹 앱에 함께 올려 배포하면 google.script.run 으로 바로 통신합니다.
// (주소를 따로 설정할 필요도, CORS 걱정도 없습니다)
const EMBEDDED = typeof google !== "undefined" && !!(google.script && google.script.run);
const REMOTE = EMBEDDED || !!API;
let WEB_APP_URL = "";                       // 학생에게 알려 줄 주소 (서버가 알려 줍니다)

function jread(k, fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function jwrite(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

async function callApi(payload){
  if (EMBEDDED) return callEmbedded(payload);
  const res = await fetch(API, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" }, // preflight 회피
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "요청을 처리하지 못했어요.");
  return data;
}

/** Apps Script 안에서 돌 때 쓰는 통신. google.script.run 을 약속(Promise)으로 감쌉니다. */
function callEmbedded(payload){
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(raw => {
        let data;
        try { data = typeof raw === "string" ? JSON.parse(raw) : raw; }
        catch (e) { return reject(new Error("서버 응답을 읽지 못했어요.")); }
        if (!data || !data.ok) return reject(new Error((data && data.error) || "요청을 처리하지 못했어요."));
        resolve(data);
      })
      .withFailureHandler(err => reject(new Error((err && err.message) || "서버에 연결하지 못했어요.")))
      .api(JSON.stringify(payload));
  });
}

const Store = {
  remote: REMOTE,

  async publicConfig(){
    if (!REMOTE) return normalizeConfig(jread(LS.cfg, null) || DEFAULT_CONFIG);
    const d = await callApi({ action:"public" });
    if (d.webAppUrl) WEB_APP_URL = d.webAppUrl;
    return normalizeConfig(d.config || DEFAULT_CONFIG);
  },
  async hasSubmitted(round, number){
    if (!REMOTE){
      return jread(LS.subs, []).some(s => s.round === round && Number(s.number) === Number(number));
    }
    const d = await callApi({ action:"check", round, number });
    return !!d.submitted;
  },
  async submit(rec){
    if (!REMOTE){
      const subs = jread(LS.subs, []);
      if (subs.some(s => s.round === rec.round && Number(s.number) === Number(rec.number)))
        throw new Error("이미 그 번호로 신청한 기록이 있어요. 선생님께 말씀드리세요.");
      subs.push(rec); jwrite(LS.subs, subs); return true;
    }
    await callApi({ action:"submit", record: rec });
    return true;
  },
  async all(pin){
    if (!REMOTE){
      return { submissions: jread(LS.subs, []), assignments: jread(LS.asg, {}), config: jread(LS.cfg, null) };
    }
    const d = await callApi({ action:"all", pin });
    return { submissions: d.submissions || [], assignments: d.assignments || {}, config: d.config || null };
  },
  async saveConfig(pin, config){
    if (!REMOTE){ jwrite(LS.cfg, config); return true; }
    await callApi({ action:"config", pin, config });
    return true;
  },
  /** Apps Script 안에서는 선생님 드라이브에 저장하고 주소를 돌려줍니다. */
  async saveFile(pin, filename, content, mime){
    const d = await callApi({ action:"savefile", pin, filename, content, mime });
    return d.url || "";
  },
  /** 지망 현황을 새 구글 스프레드시트로 만들고 주소를 돌려줍니다. (Apps Script 전용) */
  async exportSheet(pin, round){
    const d = await callApi({ action:"exportsheet", pin, round });
    return d.url || "";
  },
  async saveAssignments(pin, assignments){
    if (!REMOTE){ jwrite(LS.asg, assignments); return true; }
    await callApi({ action:"assign", pin, assignments });
    return true;
  },
  async reset(pin, config){
    if (!REMOTE){
      jwrite(LS.subs, []); jwrite(LS.asg, {}); jwrite(LS.cfg, config); return true;
    }
    await callApi({ action:"reset", pin, config });
    return true;
  }
};

/* ------------------------------------------------------------------ *
 *  도우미
 * ------------------------------------------------------------------ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function thisMonthLabel(){ const d=new Date(); return d.getFullYear()+"년 "+(d.getMonth()+1)+"월"; }
function normalizeConfig(c){
  const cfg = Object.assign({}, DEFAULT_CONFIG, c || {});
  cfg.jobs = (cfg.jobs || []).map((j,i) => ({
    id: j.id || ("j"+(i+1)), name: String(j.name||"").trim(),
    cap: Math.max(0, parseInt(j.cap,10) || 0),
    when: String(j.when||""), desc: String(j.desc||"")
  })).filter(j => j.name);
  cfg.round = parseInt(cfg.round,10) || 1;
  cfg.choiceCount = Math.min(Math.max(1, parseInt(cfg.choiceCount,10) || 3), 5);
  cfg.roster = (cfg.roster || []).map(r => ({
    n: parseInt(r.n, 10) || 0, name: String(r.name || "").trim()
  })).filter(r => r.n > 0 && r.name).sort((a,b) => a.n - b.n);
  cfg.pin = TEACHER_PIN;                                   // 저장된 값과 무관하게 고정
  return cfg;
}
/** 띄어쓰기를 무시하고 견줍니다. */
function squash(v){ return String(v == null ? "" : v).replace(/\s+/g, ""); }

/**
 * 번호와 이름이 명부와 맞는지 확인합니다.
 * 명부가 비어 있으면 확인하지 않고 통과시킵니다(다른 학급에서도 쓸 수 있도록).
 */
function rosterCheck(number, name){
  if (!CFG.roster.length) return { ok:true };
  const row = CFG.roster.find(r => r.n === Number(number));
  if (!row) return { ok:false, msg:"명부에 없는 번호예요. 번호를 다시 확인해 주세요." };
  if (!squash(name)) return { ok:false, msg:"이름을 입력해 주세요." };
  if (squash(row.name) !== squash(name))
    return { ok:false, msg:"번호와 이름이 명부와 달라요. 다시 확인해 주세요." };
  return { ok:true, name: row.name };
}

/** 코드(j1)로도, 이름(돌쇠)으로도 직업을 찾습니다. 시트에 이름으로 적히기 때문입니다. */
function findJob(cfg, key){
  if (!key) return null;
  const k = squash(key);
  return cfg.jobs.find(x => x.id === key) ||
         cfg.jobs.find(x => squash(x.name) === k) || null;
}
/** 화면에 보여 줄 직업 이름. 목록에서 사라진 직업이면 적혀 있던 값을 그대로 보여 줍니다. */
function jobName(cfg, key){
  const j = findJob(cfg, key);
  return j ? j.name : (key ? String(key) : "—");
}
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function byNumber(a,b){ return (Number(a.number)||0) - (Number(b.number)||0); }
function nowStamp(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}

/* ------------------------------------------------------------------ *
 *  배정 알고리즘 : 1지망부터 차례대로, 정원이 넘치면 무작위 추첨
 * ------------------------------------------------------------------ */
function autoAssign(cfg, submissions){
  const left = {}; cfg.jobs.forEach(j => left[j.id] = j.cap);
  const result = {};                       // number -> jobId ("" = 미배정)
  const students = shuffle(submissions.slice());
  const pending = new Set(students.map(s => String(s.number)));

  for (let rank = 0; rank < cfg.choiceCount; rank++){
    const wanted = {};                     // jobId -> [학생]
    students.forEach(s => {
      if (!pending.has(String(s.number))) return;
      const id = (s.choices || [])[rank];
      if (!id || left[id] === undefined || left[id] <= 0) return;
      (wanted[id] = wanted[id] || []).push(s);
    });
    Object.keys(wanted).forEach(id => {
      const winners = shuffle(wanted[id]).slice(0, left[id]);
      winners.forEach(s => { result[String(s.number)] = id; pending.delete(String(s.number)); left[id]--; });
    });
  }
  pending.forEach(n => { result[n] = ""; });   // 지망한 직업이 모두 찬 경우
  return result;
}

/* ---------- 학생 : 신청 화면 ---------- */
function renderStudent(msg){
  paintHeader();
  const need = Math.min(CFG.choiceCount, CFG.jobs.length);
  const slots = [];
  for (let i = 0; i < need; i++){
    const id = picks[i];
    slots.push(`<div class="slot ${id?"filled":""}"><b>${i+1}지망</b>
      <span>${id ? esc(jobName(CFG, id)) : "<span style='color:var(--muted)'>아래에서 골라 주세요</span>"}</span></div>`);
  }
  view.innerHTML = `
    ${msg ? `<div class="msg err">${esc(msg)}</div>` : ""}
    <section class="card">
      <h2>1. 내 정보 ✏️</h2>
      <p class="hint">이름과 번호를 정확하게 적어 주세요.</p>
      <div class="row">
        <div><label for="sNum">번호</label><input id="sNum" type="number" min="1" max="50" inputmode="numeric" placeholder="예) 26"></div>
        <div style="flex:2"><label for="sName">이름</label><input id="sName" type="text" maxlength="12" placeholder="예) 주채훈"></div>
      </div>
      <div id="idMsg" class="id-msg" role="status" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2>2. 하고 싶은 직업 ${need}가지 고르기 🎯</h2>
      <p class="hint">누른 순서대로 1지망 → ${need}지망이 돼요. 다시 누르면 선택이 취소됩니다.
        신청자가 많으면 다른 지망으로 배정될 수 있어요.</p>
      <div class="picked-list">${slots.join("")}</div>
      <div class="jobs" id="jobGrid">
        ${CFG.jobs.map(j => {
          const at = picks.indexOf(j.id);
          return `<div class="job ${at>=0?"picked":""}" data-id="${esc(j.id)}" role="button" tabindex="0">
            ${at>=0 ? `<div class="pick-badge">${at+1}</div>` : ""}
            <div class="job-icon" aria-hidden="true">${esc(jobIcon(j.name))}</div>
            <div class="name">${esc(j.name)}</div>
            <div class="cap">뽑는 인원 ${j.cap}명${j.when ? " · " + esc(j.when) : ""}</div>
            <div class="desc">${esc(j.desc)}</div>
          </div>`;
        }).join("")}
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn-ghost" id="clearPick" style="flex:0 0 auto">선택 지우기</button>
        <button class="btn" id="submitBtn">제출하기</button>
      </div>
      <p class="hint" style="margin:10px 0 0">제출한 뒤에는 내용을 다시 볼 수 없고, 고칠 수도 없어요. 잘 확인하고 제출하세요.</p>
    </section>`;

  // 선택이 바뀔 때 화면 전체를 다시 그리지 않고 배지와 지망 목록만 갱신합니다.
  const paintPicks = () => {
    view.querySelectorAll(".picked-list .slot").forEach((slot, i) => {
      const id = picks[i];
      slot.classList.toggle("filled", !!id);
      slot.lastElementChild.innerHTML = id
        ? esc(jobName(CFG, id))
        : "<span style='color:var(--muted)'>아래에서 골라 주세요</span>";
    });
    view.querySelectorAll(".job[data-id]").forEach(el => {
      const at = picks.indexOf(el.dataset.id);
      el.classList.toggle("picked", at >= 0);
      const badge = el.querySelector(".pick-badge");
      if (at >= 0){
        if (badge) badge.textContent = at + 1;
        else el.insertAdjacentHTML("afterbegin", `<div class="pick-badge">${at+1}</div>`);
      } else if (badge) badge.remove();
    });
  };
  view.querySelectorAll(".job[data-id]").forEach(el => {
    const toggle = () => {
      const id = el.dataset.id, at = picks.indexOf(id);
      if (at >= 0) picks.splice(at, 1);
      else if (picks.length < need) picks.push(id);
      else { flash("이미 " + need + "가지를 골랐어요. 바꾸려면 고른 직업을 다시 누르세요."); return; }
      paintPicks();
    };
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } });
  });
  // 번호·이름을 적는 즉시 명부와 맞는지 알려 줍니다.
  const numEl = view.querySelector("#sNum"), nameEl = view.querySelector("#sName"),
        idMsg = view.querySelector("#idMsg");
  const submitBtn = view.querySelector("#submitBtn");
  let checkToken = 0, checkTimer = 0;
  const paintId = () => {
    const num = numEl.value.trim(), nm = nameEl.value.trim();
    clearTimeout(checkTimer);
    const token = ++checkToken;
    submitBtn.disabled = false;
    if (!CFG.roster.length || !num || !nm){ idMsg.textContent = ""; idMsg.className = "id-msg"; return; }
    const r = rosterCheck(num, nm);
    idMsg.textContent = r.ok ? "확인됐어요! " + num + "번 " + r.name : r.msg;
    idMsg.className = "id-msg " + (r.ok ? "good" : "bad");
    if (!r.ok) return;
    // 이미 낸 번호인지 서버에 한 번 물어봅니다. (타자가 멈춘 뒤에만)
    checkTimer = setTimeout(async () => {
      try{
        const already = await Store.hasSubmitted(CFG.round, num);
        if (token !== checkToken) return;              // 그새 다시 고쳐 적었으면 버립니다
        if (already){
          idMsg.textContent = "이미 신청을 마쳤어요. 결과는 선생님이 알려 주실 거예요.";
          idMsg.className = "id-msg bad";
          submitBtn.disabled = true;
        }
      }catch(e){ /* 확인하지 못하면 제출할 때 다시 걸러집니다 */ }
    }, 500);
  };
  numEl.addEventListener("input", paintId);
  nameEl.addEventListener("input", paintId);

  view.querySelector("#clearPick").onclick = () => { picks = []; paintPicks(); };
  view.querySelector("#submitBtn").onclick = doSubmit;
}

function flash(text){
  const old = document.querySelector(".flash-msg");
  if (old) old.remove();
  const d = document.createElement("div");
  d.className = "msg info flash-msg";
  d.textContent = text;
  view.prepend(d);
  setTimeout(() => d.remove(), 3000);
}

async function doSubmit(){
  const need = Math.min(CFG.choiceCount, CFG.jobs.length);
  const number = parseInt(view.querySelector("#sNum").value, 10);
  const name = (view.querySelector("#sName").value || "").trim();
  if (!number || number < 1 || number > 50) return flash("번호를 바르게 입력해 주세요.");
  if (name.length < 2) return flash("이름을 정확히 입력해 주세요.");
  const idOk = rosterCheck(number, name);
  if (!idOk.ok) return flash(idOk.msg);            // 명부와 다르면 제출할 수 없습니다
  if (picks.length < need) return flash(need + "가지 직업을 모두 골라 주세요.");

  const list = picks.map((id, i) => `${i+1}지망 ${jobName(CFG, id)}`).join("\n");
  if (!confirm(`${number}번 ${name}\n\n${list}\n\n이대로 제출할까요?\n제출하면 다시 볼 수 없어요.`)) return;

  const btn = view.querySelector("#submitBtn");
  btn.disabled = true; btn.textContent = "제출 중…";
  const rec = {
    round: CFG.round, number, name: idOk.name || name,
    choices: picks.slice(),                             // 코드 (앱 안에서 쓰는 값)
    choiceNames: picks.map(id => jobName(CFG, id)),     // 이름 (구글 시트에 적히는 값)
    at: nowStamp()
  };
  try{
    if (await Store.hasSubmitted(CFG.round, number))
      throw new Error("이미 그 번호로 신청했어요. 선생님께 말씀드리세요.");
    await Store.submit(rec);
    jwrite(LS.lock, { round: CFG.round, number, name: rec.name, at: rec.at });
    picks = [];
    renderDone({ number, name: rec.name });
  }catch(err){
    btn.disabled = false; btn.textContent = "제출하기";
    flash(err.message || "제출하지 못했어요. 다시 시도해 주세요.");
  }
}

      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
      <div class="row" style="margin-top:14px">
        <button class="btn-ghost" id="back" style="flex:0 0 auto">돌아가기</button>
        <button class="btn" id="go">확인</button>
      </div>
    </section>`;
  const go = async () => {
    const pin = view.querySelector("#pin").value.trim();
    if (pin !== TEACHER_PIN) return renderTeacherLogin("비밀번호가 맞지 않아요.");
    try{
      const data = await Store.all(pin);
      if (data.config) CFG = normalizeConfig(data.config);   // 교사에게만 비밀번호까지 전달
      renderTeacher(pin, data, "submissions");
    }catch(e){ renderTeacherLogin(e.message || "비밀번호가 맞지 않아요."); }
  };
  view.querySelector("#go").onclick = go;
  view.querySelector("#pin").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  view.querySelector("#back").onclick = () => start();
}

/* ---------- 교사 : 대시보드 ---------- */
async function refreshTeacher(pin, tab){
  const data = await Store.all(pin);
  renderTeacher(pin, data, tab);
}

function renderTeacher(pin, data, tab){
  paintHeader();
  // 시트에는 이름으로 적혀 있을 수 있으므로, 배정 계산을 위해 코드로 맞춰 둡니다.
  const subs = (data.submissions || [])
    .filter(s => s.round === CFG.round)
    .map(s => Object.assign({}, s, {
      choices: (s.choices || []).map(c => { const j = findJob(CFG, c); return j ? j.id : c; })
    }))
    .sort(byNumber);
  const asg  = data.assignments || {};
  const tabs = [["submissions","신청 현황"],["assign","직업 배정"],["jobs","직업 관리"],["settings","설정·초기화"]];

  view.innerHTML = `
    <div class="tabs noprint">
      ${tabs.map(([k,l]) => `<button data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join("")}
      <span class="spacer"></span>
      <button class="btn-ghost btn-sm" id="exitT">학생 화면으로</button>
    </div>
    <div id="tabBody"></div>`;

  view.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => renderTeacher(pin, data, b.dataset.tab));
  view.querySelector("#exitT").onclick = () => start();

  const body = view.querySelector("#tabBody");
  if (tab === "submissions") tabSubmissions(body, pin, subs);
  if (tab === "assign")      tabAssign(body, pin, subs, asg);
  if (tab === "jobs")        tabJobs(body, pin);
  if (tab === "settings")    tabSettings(body, pin, subs);
}

  body.innerHTML = `

        <div class="stat"><div class="k">신청 직업 수</div><div class="v">${CFG.jobs.length}개</div></div>

          ? `<div class="msg info">아직 안 낸 학생 ${yet.length}명 — ${esc(yet.map(r => r.n + "번 " + r.name).join(", "))}</div>`
          : `<div class="msg ok">명부에 있는 ${CFG.roster.length}명이 모두 제출했어요! 🎉</div>`;

        <button class="btn-ghost" id="dlChoices" style="flex:0 0 auto" ${total?"":"disabled"}>지망 현황 엑셀(CSV)로 ${EMBEDDED ? "저장하기" : "내려받기"}</button>
        <button class="btn-ghost" id="refresh" style="flex:0 0 auto">새로고침</button>

      <p class="hint" style="margin:10px 0 0">회장·부회장이 직접 배정할 때는 이 표를 뽑아 쓰세요.
        직업 이름이 그대로 적히고, <b>직업별 신청자 명단</b>도 함께 만들어집니다.</p>

function tabAssign(body, pin, subs, asg){
  const need = Math.min(CFG.choiceCount, CFG.jobs.length);
  const has = Object.keys(asg).length > 0;
  const rankOf = (s) => {
    const id = asg[String(s.number)];
    if (!id) return `<span class="tag gray">미배정</span>`;
    const r = (s.choices||[]).indexOf(id);
    return r >= 0 ? `<span class="tag good">${r+1}지망</span>` : `<span class="tag">직접 지정</span>`;
  };
  const byJob = {}; CFG.jobs.forEach(j => byJob[j.id] = []);
  subs.forEach(s => { const id = asg[String(s.number)]; if (id && byJob[id]) byJob[id].push(s); });

  body.innerHTML = `
    <section class="card">
      <h2>직업 배정 🎲</h2>
      <p class="hint">1지망부터 차례로 배정하고, 정원보다 신청자가 많으면 무작위로 뽑아요.
        결과는 아래 표에서 직접 바꿀 수도 있어요.</p>
      <div class="row noprint">
        <button class="btn" id="run" style="flex:0 0 auto">${has ? "다시 배정하기" : "자동 배정하기"}</button>
        <button class="btn-ghost" id="dl" style="flex:0 0 auto" ${subs.length?"":"disabled"}>문서로 ${EMBEDDED ? "저장하기" : "내려받기"}</button>
        <button class="btn-ghost" id="csv" style="flex:0 0 auto" ${subs.length?"":"disabled"}>엑셀(CSV)로 ${EMBEDDED ? "저장하기" : "내려받기"}</button>
      </div>
      ${subs.length === 0 ? `<div class="msg info" style="margin-top:14px">아직 제출한 학생이 없어요.</div>` : `
      <div class="table-scroll" style="margin-top:14px"><table>
        <thead><tr><th class="num">번호</th><th>이름</th>
          ${Array.from({length:need},(_,i)=>`<th>${i+1}지망</th>`).join("")}
          <th>배정 직업</th><th>결과</th></tr></thead>
        <tbody>${subs.map(s => `<tr>
          <td class="num">${esc(s.number)}</td><td>${esc(s.name)}</td>
          ${Array.from({length:need},(_,i)=>`<td style="color:var(--muted)">${esc(jobName(CFG,(s.choices||[])[i]))}</td>`).join("")}
          <td><select data-num="${esc(s.number)}" style="min-width:120px">
            <option value="">— 미배정 —</option>
            ${CFG.jobs.map(j => `<option value="${esc(j.id)}" ${asg[String(s.number)]===j.id?"selected":""}>${esc(j.name)}</option>`).join("")}
          </select></td>
          <td>${rankOf(s)}</td></tr>`).join("")}</tbody>
      </table></div>`}
    </section>

    ${has ? `<section class="card">
      <h2>직업별 배정 명단 🗂️</h2>
      ${CFG.jobs.map(j => `<div style="margin-bottom:9px; font-size:.92rem">
        ${esc(jobIcon(j.name))} <b>${esc(j.name)}</b> <span style="color:var(--muted)">(${byJob[j.id].length}/${j.cap})</span> —
        ${byJob[j.id].length ? byJob[j.id].sort(byNumber).map(s => esc(s.number+"번 "+s.name)).join(", ")
                             : `<span style="color:var(--muted)">없음</span>`}</div>`).join("")}
      ${subs.filter(s => !asg[String(s.number)]).length ? `<div class="msg info" style="margin-top:10px">
        미배정: ${subs.filter(s => !asg[String(s.number)]).sort(byNumber).map(s => esc(s.number+"번 "+s.name)).join(", ")}
      </div>` : ""}
    </section>` : ""}`;

  body.querySelector("#run").onclick = async () => {
    if (!subs.length) return;
    if (has && !confirm("이미 있는 배정 결과를 지우고 다시 배정할까요?")) return;
    const result = autoAssign(CFG, subs);
    await Store.saveAssignments(pin, result);
    refreshTeacher(pin, "assign");
  };
  body.querySelectorAll("select[data-num]").forEach(sel => {
    sel.onchange = async () => {
      const next = Object.assign({}, asg);
      next[sel.dataset.num] = sel.value;
      await Store.saveAssignments(pin, next);
      refreshTeacher(pin, "assign");
    };
  });
  const dl = body.querySelector("#dl"), csv = body.querySelector("#csv");
  if (dl) dl.onclick = () => downloadDoc(subs, asg, pin);
  if (csv) csv.onclick = () => downloadCsv(subs, asg, pin);

function tabJobs(body, pin){
  const rows = CFG.jobs.map((j,i) => `
    <div class="jobedit j5" data-i="${i}">
      <input type="text" class="e-name" value="${esc(j.name)}" placeholder="직업 이름">
      <input type="number" class="e-cap" value="${j.cap}" min="0" max="40" title="뽑는 인원">
      <input type="text" class="e-when" value="${esc(j.when)}" placeholder="횟수 (예: 주2회 월·목)" title="활동 횟수">
      <textarea class="e-desc" placeholder="하는 일 설명">${esc(j.desc)}</textarea>
      <button class="btn-ghost btn-sm e-del" title="삭제">✕</button>
    </div>`).join("");
  body.innerHTML = `
    <section class="card">
      <h2>신청하는 직업 🧑‍🍳</h2>
      <p class="hint">이름 · 뽑는 인원 · 하는 일 설명을 자유롭게 고칠 수 있어요. 학생 화면에 그대로 보입니다.</p>
      <div id="jobRows">${rows}</div>
      <div class="row noprint" style="margin-top:8px">
        <button class="btn-ghost" id="addJob" style="flex:0 0 auto">+ 직업 추가</button>
      </div>
    </section>
    <section class="card noprint">
      <div class="row"><button class="btn" id="saveJobs">저장하기</button></div>
      <p class="hint" style="margin:10px 0 0">저장하면 학생 화면에 바로 반영돼요. 이미 제출된 신청 내용은 그대로 남습니다.</p>
    </section>`;

  const collect = () => {
    const jobs = Array.from(body.querySelectorAll("#jobRows .jobedit")).map((r,i) => ({
      id: CFG.jobs[Number(r.dataset.i)] ? CFG.jobs[Number(r.dataset.i)].id : ("j"+Date.now()+i),
      name: r.querySelector(".e-name").value.trim(),
      cap: Math.max(0, parseInt(r.querySelector(".e-cap").value,10) || 0),
      when: r.querySelector(".e-when").value.trim(),
      desc: r.querySelector(".e-desc").value.trim()
    })).filter(j => j.name);
    return { jobs };
  };
  body.querySelector("#addJob").onclick = () => {
    const { jobs } = collect();
    jobs.push({ id:"j"+Date.now(), name:"새 직업", cap:1, when:"", desc:"" });
    CFG = normalizeConfig(Object.assign({}, CFG, { jobs }));
    tabJobs(body, pin);
  };
  body.querySelectorAll(".e-del").forEach(b => b.onclick = () => {
    const { jobs } = collect();
    jobs.splice(Number(b.closest(".jobedit").dataset.i), 1);
    CFG = normalizeConfig(Object.assign({}, CFG, { jobs }));
    tabJobs(body, pin);
  });
  body.querySelector("#saveJobs").onclick = async () => {
    const { jobs } = collect();
    if (!jobs.length) return alert("직업을 1개 이상 남겨 주세요.");
    CFG = normalizeConfig(Object.assign({}, CFG, { jobs }));
    await Store.saveConfig(pin, CFG);
    alert("저장했어요.");
    refreshTeacher(pin, "jobs");
  };
}

    }));
    await Store.saveConfig(pin, next);
    CFG = next; paintHeader();
    alert("저장했어요.");
    refreshTeacher(pin, "settings");
  };
  body.querySelector("#saveRoster").onclick = async () => {
    // "12 이름" / "12. 이름" / "12,이름" 처럼 적어도 읽어 들입니다.
    const lines = body.querySelector("#rosterText").value.split(/\r?\n/);
    const roster = [], bad = [];
    lines.forEach(line => {
      const raw = line.trim();
      if (!raw) return;
      const m = raw.match(/^(\d{1,2})\s*[.,)\t ]\s*(.+)$/);
      if (!m) { bad.push(raw); return; }
      roster.push({ n: parseInt(m[1], 10), name: m[2].trim() });
    });
    const seen = {};
    const dup = roster.filter(r => (seen[r.n] = (seen[r.n] || 0) + 1) === 2).map(r => r.n);
    if (dup.length) return alert("번호가 겹쳐요: " + dup.join(", ") + "번\n한 번호에 한 명만 적어 주세요.");
    if (bad.length) return alert("이렇게 적힌 줄은 읽을 수 없어요:\n" + bad.slice(0,3).join("\n") +
      "\n\n한 줄에 \"번호 이름\" 형식으로 적어 주세요. (예: 1 김도현)");
    const next = normalizeConfig(Object.assign({}, CFG, { roster }));
    await Store.saveConfig(pin, next);
    CFG = next;
    alert(roster.length + "명을 저장했어요.");
    refreshTeacher(pin, "settings");
  };
  body.querySelector("#clearRoster").onclick = async () => {
    if (!confirm("명부를 비울까요? 번호·이름 확인 기능이 꺼집니다.")) return;
    const next = normalizeConfig(Object.assign({}, CFG, { roster: [] }));
    await Store.saveConfig(pin, next);
    CFG = next;
    refreshTeacher(pin, "settings");
  };
  body.querySelector("#copyLink").onclick = () => {
    const el = body.querySelector("#shareLink"); el.select();
    navigator.clipboard ? navigator.clipboard.writeText(el.value).then(()=>alert("복사했어요.")) : document.execCommand("copy");
  };
  const saveApiBtn = body.querySelector("#saveApi");
  if (saveApiBtn) saveApiBtn.onclick = () => {
    const url = body.querySelector("#apiUrl").value.trim();
    if (!/^https:\/\/script\.google\.com\//.test(url)) return alert("Google Apps Script 웹 앱 주소를 입력해 주세요.");
    localStorage.setItem(LS.api, url);
    location.href = location.origin + location.pathname + "?api=" + encodeURIComponent(url);
  };
  const off = body.querySelector("#offApi");
  if (off) off.onclick = () => {
    if (!confirm("공유 모드를 끄고 이 기기 저장 모드로 돌아갈까요?")) return;
    localStorage.removeItem(LS.api);
    location.href = location.origin + location.pathname;
  };
  const dlb = body.querySelector("#dlBefore");
  if (dlb) dlb.onclick = async () => {
    const data = await Store.all(pin);
    downloadDoc(subs, data.assignments || {}, pin);
  };
  body.querySelector("#resetAll").onclick = async () => {
    if (!confirm("정말 모든 신청 기록을 지울까요? 되돌릴 수 없어요.")) return;
    const typed = prompt('확인을 위해 "초기화" 라고 입력해 주세요.');
    if (typed !== "초기화") return alert("초기화를 취소했어요.");
    const next = normalizeConfig(Object.assign({}, CFG, { round: CFG.round + 1 }));
    await Store.reset(pin, next);
    CFG = next;
    localStorage.removeItem(LS.lock);
    alert("초기화했어요. 이제 새로 신청받을 수 있어요.");
    refreshTeacher(pin, "submissions");
  };
}

/* ------------------------------------------------------------------ *
 *  내려받기 (워드 문서 / CSV)
 * ------------------------------------------------------------------ */
/**
 * 파일을 건네줍니다.
 * Apps Script 웹 앱 안에서는 브라우저 내려받기가 막힐 수 있어 선생님 드라이브에 저장하고 주소를 엽니다.
 */
async function handOver(pin, filename, content, mime, blob){
  if (!EMBEDDED) return saveBlob(filename, blob);
  const url = await Store.saveFile(pin, filename, content, mime);
  if (!url) return alert("파일을 저장하지 못했어요.");
  const win = window.open(url, "_blank");
  if (!win) prompt("구글 드라이브에 저장했어요. 아래 주소를 복사해 열어 보세요.", url);
  else alert("구글 드라이브의 '직업 신청 결과' 폴더에 저장했어요.");
}

function saveBlob(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}
/**
 * 파일 이름은 영문·숫자로 만듭니다. 한글 파일 이름을 그대로 쓰면 일부 브라우저가
 * 이름을 버리고 확장자 없는 "download" 파일로 저장해 버려 문서가 열리지 않습니다.
 * 문서 안의 제목은 한글 그대로 들어갑니다.
 */
function fileStem(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return "class-jobs_" + d.getFullYear() + "-" + p(d.getMonth()+1);
}
async function downloadDoc(subs, asg, pin){
  const need = Math.min(CFG.choiceCount, CFG.jobs.length);
  const rows = subs.slice().sort(byNumber).map(s => {
    const cells = Array.from({length:need}, (_,i) => `<td>${esc(jobName(CFG,(s.choices||[])[i]))}</td>`).join("");
    const a = asg[String(s.number)];
    return `<tr><td align="center">${esc(s.number)}</td><td>${esc(s.name)}</td>${cells}<td><b>${a?esc(jobName(CFG,a)):"미배정"}</b></td></tr>`;
  }).join("");
  const byJob = CFG.jobs.map(j => {
    const list = subs.filter(s => asg[String(s.number)] === j.id).sort(byNumber)
                     .map(s => s.number + "번 " + s.name);
    return `<tr><td><b>${esc(j.name)}</b></td><td align="center">${list.length}/${j.cap}</td>` +
           `<td>${esc(j.when) || "-"}</td><td>${esc(list.join(", ")) || "-"}</td></tr>`;
  }).join("");
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(fileStem())}</title>
    <style>
      body{font-family:"Malgun Gothic","맑은 고딕",sans-serif; font-size:11pt}
      h1{font-size:16pt; margin:0 0 4px} h2{font-size:12.5pt; margin:22px 0 6px}
      p.sub{color:#555; margin:0 0 14px; font-size:10pt}
      table{border-collapse:collapse; width:100%}
      th,td{border:1px solid #999; padding:5px 7px; font-size:10.5pt}
      th{background:#eef1f8}
    </style></head><body>
    <h1>${esc(CFG.title)}</h1>
    <p class="sub">${esc(CFG.monthLabel || thisMonthLabel())} · 출력일 ${esc(nowStamp())} · 제출 ${subs.length}명</p>
    <h2>1. 번호순 신청·배정 결과</h2>
    <table><tr><th width="52">번호</th><th width="90">이름</th>
      ${Array.from({length:need},(_,i)=>`<th>${i+1}지망</th>`).join("")}<th>배정 직업</th></tr>${rows}</table>
    <h2>2. 직업별 명단</h2>
    <table><tr><th width="110">직업</th><th width="56">인원</th><th width="130">횟수</th><th>학생</th></tr>${byJob}</table>
    </body></html>`;
  const docContent = "\uFEFF" + html;
  await handOver(pin, fileStem() + ".doc", docContent, "application/msword",
                 new Blob([docContent], { type:"application/msword;charset=utf-8" }));
}
async function downloadCsv(subs, asg, pin){
  const need = Math.min(CFG.choiceCount, CFG.jobs.length);
  const q = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const head = ["번호","이름", ...Array.from({length:need},(_,i)=>(i+1)+"지망"), "배정 직업","제출 시각"];
  const lines = [head.map(q).join(",")];
  subs.slice().sort(byNumber).forEach(s => {
    const a = asg[String(s.number)];
    lines.push([s.number, s.name,
      ...Array.from({length:need},(_,i)=>jobName(CFG,(s.choices||[])[i])),
      a ? jobName(CFG,a) : "미배정", s.at || ""].map(q).join(","));
  });
  // 회장·부회장이 배정할 때 쓰도록 직업별 신청자 명단을 아래에 덧붙입니다.
  lines.push("");
  lines.push(["직업","정원",...Array.from({length:need},(_,i)=>(i+1)+"지망 신청자"),"배정된 학생"].map(q).join(","));
  CFG.jobs.forEach(j => {
    const who = rank => subs.filter(s => (s.choices||[])[rank] === j.id)
                            .sort(byNumber).map(s => s.number + "번 " + s.name).join(" ");
    const got = subs.filter(s => asg[String(s.number)] === j.id)
                    .sort(byNumber).map(s => s.number + "번 " + s.name).join(" ");
    lines.push([j.name, j.cap, ...Array.from({length:need},(_,i)=>who(i)), got].map(q).join(","));
  });

  const csvContent = "\uFEFF" + lines.join("\r\n");
  await handOver(pin, fileStem() + ".csv", csvContent, "text/csv",
                 new Blob([csvContent], { type:"text/csv;charset=utf-8" }));
}

async function start(){
  view.innerHTML = `<section class="card"><p class="hint" style="margin:0">불러오는 중…</p></section>`;
  try{
    CFG = await Store.publicConfig();
  }catch(e){
    view.innerHTML = `<section class="card"><div class="msg err">
      설정을 불러오지 못했어요. 인터넷 연결을 확인하거나 선생님께 알려 주세요.<br>(${esc(e.message)})</div></section>`;
    return;
  }
  paintHeader();
  const lock = jread(LS.lock, null);
  if (lock && lock.round === CFG.round) renderDone(lock);
  else { picks = []; renderStudent(); }
}
start();
